name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet ./...

      # compress(1) is the program every .Z file in the world was made by, and
      # squeeze() in compress_test.go builds every reference fixture with it.
      # macOS ships /usr/bin/compress, so the judge has been running there --
      # and on NEITHER Linux lane, which is where -race and the coverage gate
      # run. Ubuntu spells it `ncompress`.
      - name: the reference encoder
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ncompress

      # ⛔ An install is not a binary. `apt-get install 7zip` succeeded on noble
      # and provided no /usr/bin/7zz; the judge in go-filesystems/unarchive went
      # on skipping and only a guard said so. Ask the runner directly.
      - name: compress(1) is really here
        if: runner.os != 'Windows'
        run: command -v compress

      # ⛔ `go test | tee` hands the pipeline TEE's exit status, so a failing
      # suite reads as a pass. GitHub's `shell: bash` already adds -o pipefail,
      # but a step whose correctness rests on a default nobody can see in it is
      # a step that breaks the day the default moves. Written out.
      - name: test
        shell: bash
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee test-output.txt

      # squeeze() skips for three different reasons and only one of them is a
      # defect: the other two are the generator refusing a fixture it cannot
      # round-trip, which is a policy this test states on purpose. So match the
      # ONE message that means the judge never ran, not `--- SKIP`.
      - name: the judge must have judged
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if grep -q "no compress(1) here" test-output.txt; then
            echo "::error::compress(1) was not found; every fixture went unbuilt"
            exit 1
          fi
      - name: coverage gate (100%)
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -covermode=atomic -coverprofile=cov.out -coverpkg=$COVERPKG ./...
          go tool cover -func=cov.out | tail -n 20
          if go tool cover -func=cov.out | grep -vE '100\.0%' | grep -v '^total:'; then
            echo "coverage below 100%"; exit 1
          fi
  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie", qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie", qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie", qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/t.test .
      - run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t ${{ matrix.image }} /t/t.test -test.v -test.short -test.timeout 20m
